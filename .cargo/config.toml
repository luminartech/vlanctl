# Points cargo at this org's Kellnr instance, mirroring the pattern
# `luminartech/beacon` uses for the same registry (see its own
# `.cargo/config.toml`). Two separate things are configured below, and both
# are needed for `vlanctl` to build in CI at all:
#
#   1. `[registries.kellnr]` — lets `cargo publish --registry kellnr` (and
#      `cargo release`, via release.toml / .github/cargo-release-ci.toml)
#      find the index to upload to.
#
#   2. `[source.crates-io]` replaced with Kellnr's crates.io proxy — this
#      org's CI runners are on a network that cannot reach crates.io
#      directly, so every `crates.io` dependency (anyhow, clap, ipnet, serde,
#      ...) has to be fetched through Kellnr's proxy instead. Without this
#      block, `cargo build`/`cargo test` fail to resolve dependencies on
#      those runners even though nothing in Cargo.toml points at Kellnr.
#
# Both endpoints require an auth token (`CARGO_REGISTRIES_KELLNR_TOKEN`,
# sourced from the `KELLNR_CI_TOKEN` CI secret) — reads are gated the same as
# publishes, so every CI job that runs cargo, not only the publish job, must
# have that env var set. A developer machine on the corporate network reads
# the same way via a token in `~/.cargo/credentials.toml`; nothing below
# embeds a credential.
#
# `sparse+https://` (not `http://`) throughout: this Kellnr instance serves
# both endpoints over TLS, and sparse (rather than git) indexes avoid cloning
# a full index repo just to resolve one crate.
[registries]
kellnr = { index = "sparse+https://kellnr-eq-dc.sw-ci.kraken.as/api/v1/crates/" }

[source.crates-io]
replace-with = "kellnr-proxy"

[source.kellnr-proxy]
registry = "sparse+https://kellnr-eq-dc.sw-ci.kraken.as/api/v1/cratesio/"
