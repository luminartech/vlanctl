name = "lum_legacy"
description = "Legacy Luminar sensors: VLAN 10 and VLAN 11 share 192.168.10.0/24"

# Physical adapter the VLANs trunk onto (USB 10/100/1000 LAN). Pinned because
# auto-detect would otherwise grab en0 (Wi-Fi), which can't carry 802.1Q VLANs.
device = "en12"

# VLAN 10 — DoIP. Host .90, sensor .150.
[[interface]]
vlan = 12
address = "192.168.11.90/24"

  # Host route to the sensor, pinned to this interface. Required here because
  # VLAN 11 shares 192.168.10.0/24, so the sensor must be reached via vlan10.
  [[interface.route]]
  destination = "192.168.11.150/32"

  # DoIP announce route: add here once the announce address is confirmed.
  # VLAN 10 — DoIP. Host .90, sensor .150.
  [[interface]]
  vlan = 10
  address = "192.168.10.90/24"

    # Host route to the sensor, pinned to this interface. Required here because
    # VLAN 11 shares 192.168.10.0/24, so the sensor must be reached via vlan10.
    [[interface.route]]
    destination = "192.168.10.150/32"

    # DoIP announce route: add here once the announce address is confirmed.
