name = "halo"
description = "Halo A3 (LUM Gen FW): untagged UDP data path + VLAN 12 telnet."

# Untagged UDP data path: sensor 192.168.10.151 (out-of-subnet), host
# 192.168.1.100/24, plus the SOME/IP-SD multicast group. vlanctl configures the
# parent device directly and leaves it configured on `down`.
[[interface]]
address = "192.168.1.100/24"

  # Data sensor — out of the host's /24, reached via an on-link route + static
  # ARP (the sensor doesn't answer ARP; macOS would otherwise self-MAC it).
  #
  # BENCH-SPECIFIC VALUE: the `mac` below is one particular Halo unit's
  # address. A static ARP entry has to name a real MAC, so there is no sensible
  # default — replace it with your own sensor's. (EnVision's derived-profile
  # path reads the real MAC off the wire, so this only matters for
  # hand-authored profiles.)
  [[interface.route]]
  destination = "192.168.10.151/32"
  mac = "3a:42:f7:79:32:2e"

  # SOME/IP-SD multicast group.
  [[interface.route]]
  destination = "239.255.0.255/32"

# VLAN 12 — telnet debug. Sensor .152, reached by the connected /24 route.
[[interface]]
vlan = 12
address = "192.168.10.1/24"

# VLAN 10 — DoIP. Host .90, sensor .150.
[[interface]]
vlan = 10
address = "192.168.10.90/24"

  # Host route to the sensor, pinned to this interface.
  [[interface.route]]
  destination = "192.168.10.150/32"

# VLAN 11 — SOME/IP. Host .87, sensor .151. (SOME/IP-SD multicast is already
# carried on the untagged data path above, so it's not duplicated here.)
[[interface]]
vlan = 11
address = "192.168.11.87/24"

  # Host route to the sensor, pinned to this interface.
  [[interface.route]]
  destination = "192.168.11.151/32"

# HARDWARE NOTE: requires a USB NIC that transmits 802.1Q tags under macOS.
# The 98:fc:84:ec:ea:f1 dongle (en7) silently drops tags on TX; the Realtek
# dongle (00:e0:4c:..., en16) works. Pin `device` to the good adapter if
# auto-detect might pick the bad one.
