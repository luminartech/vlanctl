name = "lum"
description = "Luminar sensors: VLAN 10 on 192.168.10.0/24, VLAN 11 on 192.168.11.0/24"

# VLAN 10 — DoIP. Host .90, sensor .150.
[[vlan]]
id = 10
address = "192.168.10.90/24"

  # Host route to the sensor, pinned to this interface.
  [[vlan.route]]
  destination = "192.168.10.150/32"

  # DoIP announce route: add here once the announce address is confirmed.

# VLAN 11 — SOME/IP. Host .87, sensor .151.
[[vlan]]
id = 11
address = "192.168.11.87/24"

  # Host route to the sensor, pinned to this interface.
  [[vlan.route]]
  destination = "192.168.11.151/32"

  # SOME/IP-SD multicast group, pinned to this interface.
  [[vlan.route]]
  destination = "239.255.0.255/32"
