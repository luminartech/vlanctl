name = "lum"
description = "Luminar sensors: VLAN 10 on 192.168.10.0/24, VLAN 11 on 192.168.11.0/24"

# No `device` here on purpose: the parent adapter is host-local. macOS numbers
# adapters `enN` per machine (a USB dongle can be en7 on one Mac and en12 on
# another) and Linux uses `eth0`/`enp*`/`enx*` entirely, so any committed value
# is wrong for everyone but the machine it was written on. Auto-detect picks the
# single active wired adapter and skips Wi-Fi, which cannot carry 802.1Q VLANs;
# pass `--device <name>` when auto-detect is ambiguous or picks wrong.

# VLAN 10 — DoIP. Host .90, sensor .150.
[[interface]]
vlan = 10
address = "192.168.10.90/24"

  # Host route to the sensor, pinned to this interface.
  [[interface.route]]
  destination = "192.168.10.150/32"

  # DoIP announce route: add here once the announce address is confirmed.

# VLAN 11 — SOME/IP. Host .87, sensor .151.
[[interface]]
vlan = 11
address = "192.168.11.87/24"

  # Host route to the sensor, pinned to this interface.
  [[interface.route]]
  destination = "192.168.11.151/32"

  # SOME/IP-SD multicast group, pinned to this interface.
  [[interface.route]]
  destination = "239.255.0.255/32"
