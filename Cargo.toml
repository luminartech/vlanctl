[package]
name = "vlanctl"
version = "0.1.0"
edition = "2024"
# Required for `cargo publish`/`cargo release` to a registry at all — cargo
# refuses to publish a package with no license/description. The values below
# mirror beacon's `[workspace.package]` (this org's other Kellnr-published
# Rust project): `LicenseRef-Proprietary` because this is unpublished
# internal tooling with no OSI license, and the same authors string, since
# both crates are Microvision-owned rather than attributed to an individual.
license = "LicenseRef-Proprietary"
authors = ["Microvision, Inc."]
description = "Apply and tear down named VLAN profiles for lidar sensor networking"
repository = "https://github.com/luminartech/vlanctl"
# Restricts `cargo publish` to the named registry so a bare `cargo publish`
# (no --registry flag) can never push this internal crate to crates.io by
# mistake — same safety rail beacon puts on every one of its crates.
publish = ["kellnr"]

[lib]
name = "vlanctl"
path = "src/lib.rs"

[[bin]]
name = "vlanctl"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:libc"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"], optional = true }
ipnet = { version = "2.12", features = ["serde"] }
libc = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
