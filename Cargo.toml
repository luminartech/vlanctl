[package]
name = "vlanctl"
version = "0.1.0"
edition = "2024"
# Edition 2024 alone only requires rustc 1.85, but src/plan.rs uses let-chain
# expressions (`if let ... && let ...`), stabilized in 1.88 — confirmed
# locally: 1.85 and 1.87 fail to compile this crate with E0658, 1.88
# succeeds. 1.88.0 is therefore the honest MSRV floor, and the shared CI
# workflow's `msrv` job builds against exactly this version to keep the
# claim honest.
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["Justin Kovacich <justin_kovacich@microvision.com>", "Zachary Heylmun <zachary_heylmun@microvision.com>"]
description = "Apply and tear down named VLAN profiles for lidar sensor networking"
repository = "https://github.com/luminartech/vlanctl"
homepage = "https://github.com/luminartech/vlanctl"
documentation = "https://docs.rs/vlanctl"
keywords = ["vlan", "networking", "cli", "macos", "linux"]
categories = [
    "command-line-utilities",
    "network-programming",
    "os::macos-apis",
    "os::linux-apis",
]
# CI and release tooling are not part of what a consumer builds against.
exclude = [".github/", ".gitignore", "deny.toml", "release.toml", "release-plz.toml"]

[lib]
name = "vlanctl"
path = "src/lib.rs"

[[bin]]
name = "vlanctl"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:libc"]
# Opt-in: runs the permanence tests that shell out to a real `netplan
# generate` and read what it produced. Off by default because CI containers
# do not ship `netplan.io`; on a Linux host that has opted in, a missing
# binary is a hard failure rather than a silent skip.
netplan-tests = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"], optional = true }
ipnet = { version = "2.12", features = ["serde"] }
libc = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# `conflict::probe` sends and reads raw ARP. Linux and macOS only, the two
# platforms vlanctl has a backend for; elsewhere the probe reports itself
# unavailable rather than pulling in a WinPcap link dependency.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
pnet_datalink = "0.35"
