[package]
name = "vlanctl"
version = "0.1.0"
edition = "2024"

[lib]
name = "vlanctl"
path = "src/lib.rs"

[[bin]]
name = "vlanctl"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"], optional = true }
ipnet = { version = "2.12", features = ["serde"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
